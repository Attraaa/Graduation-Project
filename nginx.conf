events {}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            # 핵심! 도커 안에서는 localhost 대신 서비스 이름(backend)을 씁니다.
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}