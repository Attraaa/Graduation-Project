events {}

http {
    server {
        listen 80;

        # 메인 주소로 오면 프론트엔드(3000번)로 보내라!
        location / {
            proxy_pass http://frontend:3000; 
        }

        # /api 로 시작하는 주소만 백엔드(8000번)로 보내라!
        location /api {
            proxy_pass http://backend:8000;
        }
    }
}
