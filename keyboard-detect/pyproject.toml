[project]
name = "moti-keyboard"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.8.0,<4.12",
    "numpy>=1.26.0,<2.0",
    "ultralytics>=8.0.0",
    "pynput>=1.7.6",
    "mediapipe==0.10.21",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
web = ["flask>=3.0.0", "flask-socketio>=5.3.6", "simple-websocket>=1.0.0"]

[dependency-groups]
dev = ["roboflow>=1.1.0"]

[tool.uv]
package = false
default-groups = []
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

# CPU wheels avoid requiring a CUDA installation on every developer laptop.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
