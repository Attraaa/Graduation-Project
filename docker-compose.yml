version: '3.8'

services:
  # 1. 백엔드 (FastAPI)
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db  # DB가 켜진 후에 백엔드를 켜라!

  # 2. 데이터베이스 (PostgreSQL)
  db:
    image: postgres:15
    environment: # DB 접속 계정과 비밀번호 설정
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # 컨테이너가 꺼져도 데이터가 날아가지 않게 보관!

  # 3. 입구 (Nginx)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # 외부의 80 포트를 Nginx의 80 포트로 연결
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf # 아까 만든 설정 파일을 Nginx에 덮어씌움
    depends_on:
      - backend

# 도커가 관리하는 가상 하드디스크 공간 선언
volumes:
  pgdata: